<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* base reset (matches the hosted artifact) */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; font: 14px system-ui, sans-serif }
img { max-width: 100% }
[hidden] { display: none !important }
</style>
<title>Zaki demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: top bar with one search-or-ask box, tabs under it, one column of panels. Detail opens in a side drawer so you never lose your place.
   Signature element: the deal timeline rail. Everything else stays quiet and crisp. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --raise: #f9fafb; --fg: #1a1d24; --muted: #646b78; --faint: #949aa5; --line: #e9ebef; --logo-bg: #ffffff;
  --accent: #3448d6; --accent-ink: #ffffff; --accent-soft: #eceffd;
  --good: #1d7a4b; --good-bg: #e4f4ea; --warn: #9e5f00; --warn-bg: #fdf1dc; --bad: #c03a2d; --bad-bg: #fbe7e4;
  --bubble-bot: #f0f2f5; --overlay: rgba(14, 18, 28, .42); --shadow: 0 12px 40px rgba(18, 21, 28, .14);
  --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1115; --surface: #171a21; --raise: #1c2029; --fg: #e7e9ee; --muted: #9aa1ad; --faint: #6d7480; --line: #2a2f3a;
  --accent: #8d9cff; --accent-ink: #0f1115; --accent-soft: #22284a;
  --good: #5fd39a; --good-bg: #16301f; --warn: #f0b65a; --warn-bg: #33270f; --bad: #ff8a7a; --bad-bg: #3a1c19;
  --bubble-bot: #20242d; --overlay: rgba(0, 0, 0, .6); --shadow: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a21; --raise: #1c2029; --fg: #e7e9ee; --muted: #9aa1ad; --faint: #6d7480; --line: #2a2f3a;
  --accent: #8d9cff; --accent-ink: #0f1115; --accent-soft: #22284a;
  --good: #5fd39a; --good-bg: #16301f; --warn: #f0b65a; --warn-bg: #33270f; --bad: #ff8a7a; --bad-bg: #3a1c19;
  --bubble-bot: #20242d; --overlay: rgba(0, 0, 0, .6); --shadow: 0 12px 40px rgba(0, 0, 0, .5); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 18px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -.01em }
h1 { font-size: clamp(26px, 4.4vw, 34px); font-weight: 700; letter-spacing: -.025em }
h2 { font-size: 18px; font-weight: 650 }
h3 { font-size: 15px; font-weight: 600 }
p { margin: 0 }
button, select, textarea, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.faint { color: var(--faint) }
.small { font-size: 13px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.tnum { font-variant-numeric: tabular-nums }

/* buttons */
.btn { background: var(--accent); color: var(--accent-ink); border: 0; padding: 9px 14px; border-radius: 9px; font-weight: 600; white-space: nowrap }
.btn:hover { filter: brightness(1.08) }
.ghost { background: var(--surface); border: 1px solid var(--line); padding: 8px 13px; border-radius: 9px; font-weight: 500; white-space: nowrap }
.ghost:hover { border-color: var(--faint) }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600 }
.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px }

/* top bar */
.top { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; margin-bottom: 18px }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.01em }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--fg); display: grid; place-items: center }
.proto { font-size: 12px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); padding: 0 7px; border-radius: 6px }
.topr { display: flex; gap: 8px; align-items: center }
.badge { background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 18px; margin-left: 6px; font-weight: 600 }
.search { position: relative; max-width: 520px; width: 100%; justify-self: center }
.search input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface) }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%) }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 40; padding: 6px; display: grid }
.res { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; text-align: left; background: none; border: 0 }
.res:hover, .res.hl { background: var(--raise) }
.res .k { font-size: 12px; color: var(--faint) }

.hello { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 22px }
.week { color: var(--muted); font-size: 15px }
.week b { color: var(--fg); font-weight: 600 }
.hello > div { display: grid; gap: 4px }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto }
.tab { background: none; border: 0; padding: 10px 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600 }
.tab .badge { margin-left: 6px }

.stack { display: grid; gap: 20px }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 18px; min-width: 0 }
.bh { display: flex; justify-content: space-between; align-items: start; gap: 10px; flex-wrap: wrap }
.bh > div { display: grid; gap: 2px; min-width: 0 }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.kpi { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px }
.kpi b { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.kpi .d { font-size: 12px }
.up { color: var(--good) } .down { color: var(--bad) }

/* list items */
.list { display: grid }
.item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line) }
.item:first-child { border-top: 0 }
.item > div { min-width: 0; display: grid; gap: 1px }
.item.click { cursor: pointer; border-radius: 8px }
.item.click:hover { background: var(--raise) }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px }
.ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center }
.ic.bad { background: var(--bad-bg); color: var(--bad) } .ic.warn { background: var(--warn-bg); color: var(--warn) }
.ic.good { background: var(--good-bg); color: var(--good) } .ic.acc { background: var(--accent-soft); color: var(--accent) }
.cb { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: transparent; justify-self: center }
.cb:hover { border-color: var(--good); color: var(--good) }
.cb.bad { border-color: var(--bad) } .cb.warn { border-color: var(--warn) }
.more { justify-self: start }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted) }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; display: inline-block }
.pill.good { background: var(--good-bg); color: var(--good) } .pill.warn { background: var(--warn-bg); color: var(--warn) }
.pill.bad { background: var(--bad-bg); color: var(--bad) } .pill.neu { background: var(--raise); color: var(--muted); border: 1px solid var(--line) }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px }

.filters { display: flex; gap: 6px; flex-wrap: wrap }
.f { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500 }
.f[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.dotc { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px }

/* table */
.tablewrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 6px 10px 8px 0; border-bottom: 1px solid var(--line) }
td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap }
tr:last-child td { border-bottom: 0 }
td.num, th.num { text-align: right }

/* deal timeline rail */
.deal { display: grid; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line) }
.deal:first-of-type { border-top: 0; padding-top: 0 }
.deal.flash { animation: flash 1.6s ease-out }
@keyframes flash { 0% { background: var(--accent-soft) } 100% { background: transparent } }
.dealhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: start }
.dealhead > div { display: grid; gap: 2px; min-width: 0 }
.price { font-size: 20px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.nextup { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line) }
.nextup.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad) }
.nextup.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn) }
.nextup b { color: inherit }
.rail { position: relative; height: 46px; margin: 0 8px }
.track { position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--line) }
.track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fg); border-radius: 2px }
.ms { position: absolute; top: 15px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--faint) }
.ms.done { background: var(--fg); border-color: var(--fg) }
.ms.next { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft) }
.ms.risk { border-color: var(--bad); background: var(--bad); box-shadow: 0 0 0 5px var(--bad-bg) }
.ms span { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--faint); white-space: nowrap; font-family: var(--mono) }
.now { position: absolute; top: 0; bottom: 12px; width: 0; border-left: 1px dashed var(--accent) }
.now b { position: absolute; top: -2px; left: 4px; font-size: 11px; color: var(--accent); font-weight: 600 }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px }
.mlist, .docs { display: grid; gap: 0 }
.mrow, .drow { display: grid; grid-template-columns: 60px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px }
.drow { grid-template-columns: 1fr auto }
.mrow:first-child, .drow:first-child { border-top: 0 }
.mrow.past { color: var(--faint) }

/* contact drawer */
.drawer-ov { position: fixed; inset: 0; background: var(--overlay); z-index: 45 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 46; overflow-y: auto; box-shadow: var(--shadow);
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start }
.dhead { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center }
.dhead .av { width: 48px; height: 48px; font-size: 16px }
.stages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px }
.stage { border: 0; padding: 0; background: none; display: grid; gap: 6px; text-align: left; font-size: 11px; color: var(--faint) }
.stage i { height: 4px; border-radius: 2px; background: var(--line) }
.stage.past i { background: var(--fg) } .stage.cur i { background: var(--accent) }
.stage.cur { color: var(--accent); font-weight: 600 } .stage.past { color: var(--muted) }
.wants { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.want { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line) }
.want:first-child { border-top: 0 }
.want .k { color: var(--muted); font-size: 13px }
.want .src { display: block; font-size: 12px; color: var(--faint) }
.want.new { background: var(--accent-soft) }
.addwant { display: flex; gap: 8px }
.addwant input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg) }
.tl { display: grid; gap: 0; position: relative }
.tli { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 8px 0; position: relative }
.tli::before { content: ""; position: absolute; left: 13px; top: 36px; bottom: -8px; width: 2px; background: var(--line) }
.tli:last-child::before { display: none }
.tli .ic { width: 28px; height: 28px; border-radius: 50% }
.tli > div { min-width: 0; display: grid; gap: 2px }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.quick button { display: grid; gap: 4px; justify-items: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); font-size: 13px; font-weight: 500 }
.quick button:hover { border-color: var(--accent) }
.sec { display: grid; gap: 10px }
.sec > h3 { font-size: 13px; color: var(--muted); font-weight: 600 }

/* chat */
.chat { display: grid; gap: 12px; grid-template-rows: auto 1fr auto auto; min-height: 460px }
.msgs { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 440px; padding: 2px }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-line }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px }
.msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { background: var(--surface); border: 1px solid var(--line); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; text-align: left }
.chip:hover { border-color: var(--accent); color: var(--accent) }
.send { display: flex; gap: 8px }
.send input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg) }

/* calls */
.scores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.score { display: grid; gap: 6px; font-size: 13px }
.score span { display: flex; justify-content: space-between }
.transcript { background: var(--raise); border-radius: 10px; padding: 12px; font-size: 14px; display: grid; gap: 6px; max-height: 200px; overflow-y: auto }
.transcript b { color: var(--accent); font-weight: 600 }
.actions { display: flex; flex-wrap: wrap; gap: 6px }
.act { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); padding: 6px 10px; border-radius: 9px; font-weight: 500; font-size: 13px }
.act:hover { border-color: var(--accent) }
.act.off { color: var(--muted); border-style: dashed }
.mini { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); flex: none }
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; flex-wrap: wrap }
.drop:hover { border-color: var(--accent) }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px }
.working { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

/* apps */
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px }
.app { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
.logo { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft) }
img.logo, img.mini { background: var(--logo-bg); object-fit: contain; border: 1px solid var(--line); padding: 4px }
img.mini { padding: 2px }
.app > div { min-width: 0; display: grid }
.on { color: var(--good); font-size: 12px; font-weight: 600 }
.switch { width: 40px; height: 24px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; padding: 0 }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3) }
.switch[aria-checked="true"] { background: var(--good) }
.switch[aria-checked="true"]::after { left: 19px }
.switch:disabled { opacity: .6; cursor: default }
.rule { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line) }
.rule:first-child { border-top: 0 }
.rule > div { min-width: 0; display: grid; gap: 2px }
.rot { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px }

/* role picker */
.pick { display: grid; gap: 26px; padding-top: 4vh; max-width: 780px }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
.role { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 12px; transition: border-color .15s, box-shadow .15s }
.role:hover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft) }
.role ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 3px; font-size: 14px }

/* modal, toast */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.modal { background: var(--surface); border-radius: 16px; padding: 20px; width: min(500px, 100%); display: grid; gap: 14px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow) }
.modal.wide { width: min(640px, 100%) }
.mh { display: flex; gap: 12px; align-items: center }
.mh > div { display: grid; gap: 1px; min-width: 0 }
.modal ul { margin: 0; padding-left: 20px; display: grid; gap: 4px }
.modal textarea, .modal select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg) }
.modal textarea { min-height: 130px; resize: vertical; line-height: 1.45 }
.btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 500; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow) }

@media (prefers-reduced-motion: reduce) { .spin, .deal.flash { animation: none } .switch::after { transition: none } }
@media (max-width: 820px) {
  .grid2 { grid-template-columns: 1fr }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .top { grid-template-columns: 1fr auto }
  .search { grid-column: 1 / -1; grid-row: 2; max-width: none }
}
@media (max-width: 560px) {
  .cols { grid-template-columns: 1fr }
  .item { grid-template-columns: 32px minmax(0, 1fr) }
  .item > .row-actions, .item > .pill { grid-column: 2; justify-content: start; justify-self: start }
  .want { grid-template-columns: 1fr; gap: 2px }

/* ================= helpers ================= */
const money = n => "$" + n.toLocaleString("en-US");
const contact = id => contacts.find(c => c.id === id);
const dealName = d => d.contact ? contact(d.contact).name : d.who;
function nextMs(d) { return d.ms.find(m => days(m[1]) >= 0) || d.ms[d.ms.length - 1]; }
function dealTone(d) { const n = days(nextMs(d)[1]); return d.risk || d.docs.some(x => x[1] === "missing") && n <= 4 ? "bad" : n <= 3 ? "warn" : ""; }
function logo(id, big) {
  const cls = big ? "logo" : "mini";
  if (LOGOS[id]) return `<img class="${cls}" src="${LOGOS[id]}" alt="" aria-hidden="true">`;
  const icon = { phone: "phone", mls: "home", sms: "text" }[id] || "spark";
  return `<span class="${cls}" aria-hidden="true">${svg(icon, big ? 18 : 12)}</span>`;
}
function needBtn(needs, label, attrs) {
  const on = anyOn(needs);
  return on ? `<button class="act" ${attrs}>${logo(on)}${label}</button>`
    : `<button class="act off" data-connect="${needs[0]}">${logo(needs[0])}Connect ${app(needs[0]).name}</button>`;
}

/* ---------- shared: deals ---------- */
function rail(d) {
  const t0 = D(d.ms[0][1]), t1 = D(d.ms[d.ms.length - 1][1]), span = t1 - t0 || 1;
  const pos = s => Math.max(0, Math.min(100, (D(s) - t0) / span * 100));
  const nowP = Math.max(0, Math.min(100, (TODAY - t0) / span * 100));
  const nx = nextMs(d), tone = dealTone(d);
  return `<div class="rail" aria-hidden="true"><div class="track"><i style="width:${nowP}%"></i></div>
    <span class="now" style="left:${nowP}%"><b>Today</b></span>
    ${d.ms.map(([l, s], k) => { const past = days(s) < 0, isNext = nx[1] === s && !past;
      return `<span class="ms ${past ? "done" : isNext ? (tone === "bad" ? "risk" : "next") : ""}" style="left:${pos(s)}%" title="${l}, ${fmt(s)}">${k === 0 || k === d.ms.length - 1 ? `<span>${fmt(s)}</span>` : ""}</span>`; }).join("")}
  </div>`;
}

function dealBlock(d) {
  const nx = nextMs(d), tone = dealTone(d), n = days(nx[1]);
  const docStatus = { signed: ["good", "Signed"], waiting: ["warn", "Waiting on signature"], missing: ["bad", "Missing"], draft: ["neu", "Draft"] };
  return `<div class="deal" data-deal="${d.id}">
    <div class="dealhead"><div>
      <span class="small muted">${d.side} side${role === "lead" ? `, ${d.agent}` : ""}</span>
      <h3>${esc(d.addr)}</h3>
      <span class="small muted">${d.contact ? `<button class="link" data-contact="${d.contact}">${esc(dealName(d))}</button>` : esc(dealName(d))}</span>
    </div><div style="text-align:right"><div class="price">${money(d.price)}</div><span class="small muted tnum">${money(Math.round(d.price * d.commission))} commission</span></div></div>
    <div class="nextup ${tone}">${svg(tone ? "alert" : "clock")}<span><b>${nx[0]}</b> ${rel(nx[1])}, ${wk(nx[1])} ${fmt(nx[1])}${/Due diligence/.test(nx[0]) ? " at 11:59 PM" : ""}${d.risk ? `. ${d.risk}.` : ""}</span></div>
    ${rail(d)}
    ${openDeals.has(d.id) ? `<div class="cols">
      <div class="sec"><h3>Dates</h3><div class="mlist">${d.ms.map(([l, s]) => `<div class="mrow ${days(s) < 0 ? "past" : ""}"><span class="mono small">${fmt(s)}</span><span>${l}</span><span class="small ${days(s) < 0 ? "faint" : days(s) <= 3 ? "down" : "muted"}">${days(s) < 0 ? "Done" : rel(s)}</span></div>`).join("")}</div></div>
      <div class="sec"><h3>Documents</h3><div class="docs">${d.docs.map(([l, st]) => `<div class="drow"><span>${l}<br><span class="pill ${docStatus[st][0]}" style="margin-top:3px">${docStatus[st][1]}</span></span>
        <span>${st === "missing" ? (anyOn(SIGN) ? `<button class="btn sm" data-sign="${d.id}" data-doc="${l}">Send for signature</button>` : `<button class="ghost sm" data-connect="docusign">Connect DocuSign</button>`)
          : st === "waiting" ? `<button class="ghost sm" data-toast="Reminder sent for ${l}">Send reminder</button>` : st === "draft" ? `<button class="ghost sm" data-toast="Opened ${l}">Finish</button>` : ""}</span></div>`).join("")}</div></div>
    </div>
    <div class="actions">${needBtn(["gcal", "outlook"], "Put dates on my calendar", `data-toast="All ${d.ms.length} dates added to your calendar"`)}
      ${role === "lead" ? needBtn(["slack", "msteams"], "Message " + first(d.agent), `data-nudge="${d.agent}" data-about="${d.id}"`) : needBtn(["gmail", "outlook"], "Email the client an update", `data-toast="Update email drafted"`) + `<button class="act" data-milestones="${d.id}">${svg("mail", 14)}Write an email for each date</button>`}</div>` : ""}
    <button class="link small more" data-toggledeal="${d.id}" aria-expanded="${openDeals.has(d.id)}">${openDeals.has(d.id) ? "Hide details" : "Show dates and documents"}${!openDeals.has(d.id) && d.docs.some(x => x[1] === "missing") ? " (1 document missing)" : ""}</button>
  </div>`;
}

const VIEWS = { today: todayView, listings: listingsView, weekly: weeklyView, contacts: contactsView, deals: dealsView, chat: chatView, apps: appsView, office: officeView, agents: agentsView, leads: leadsView };

/* ================= drawer ================= */
function renderDrawer() {
  const r = $("#drawerRoot");
  if (!drawer) { r.innerHTML = ""; return; }
  const body = drawer.type === "contact" ? contactDrawer(contact(drawer.id)) : agentDrawer(team.find(t => t.id === drawer.id));
  const keepScroll = r.querySelector(".drawer")?.scrollTop || 0, enter = r.querySelector(".drawer") ? "" : "enter";
  r.innerHTML = `<div class="drawer-ov ${enter}" data-closedrawer></div><aside class="drawer ${enter}" role="dialog" aria-modal="true">${body}</aside>`;
  r.querySelector(".drawer").scrollTop = keepScroll;
}

    <div class="quick">
      <button data-shownum="${c.id}">${svg("phone")}Call</button>

      <button data-compose="email">${svg("mail")}Email</button>
      <button data-ask="Write a follow-up text for ${esc(first(c.name))}">${svg("spark")}Ask AI</button>
    </div>
    ${drawer.shownum ? `<div class="nextup"><span class="mono" style="user-select:all;font-size:16px">${c.phone}</span><span style="flex:1"></span><button class="ghost sm" data-copy="${c.phone}">Copy</button></div>` : ""}
    <div class="nextup ${c.heat === "hot" ? "bad" : ""}">${svg("clock")}<span><b>Next:</b> ${esc(c.next)}</span></div>
    <div class="sec"><h3>What they want</h3>
      <div class="wants">${wants.map(([k, v, src, isNew]) => `<div class="want ${isNew ? "new" : ""}"><span class="k">${esc(k)}</span><span>${esc(v)}<span class="src">${esc(src)}</span></span></div>`).join("")}</div>

      <span class="small faint">New things they say on calls get added here on their own.</span>

    ${d ? `<div class="sec"><h3>Deal</h3><div class="nextup ${dealTone(d)}">${svg("doc")}<span style="flex:1"><b>${esc(d.addr)}</b>, ${money(d.price)}<br><span class="small">${nextMs(d)[0]} ${rel(nextMs(d)[1])}</span></span><button class="ghost sm" data-gotodeal="${d.id}">Open</button></div></div>` : ""}
    <div class="sec"><h3>History</h3><div class="tl">${c.act.map(([t, s, txt, callId]) => `<div class="tli"><span class="ic ${icons[t][0]}">${svg(icons[t][1], 14)}</span>

/* ================= modals ================= */
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }
function openModal(html, wide) {
  $("#modalRoot").innerHTML = `<div class="overlay" data-close><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $("#modalRoot").querySelector("select, textarea, .btn"); if (f) f.focus();
}
const closeModal = () => { $("#modalRoot").innerHTML = ""; };
let modalSend = null;

function connectModal(id) {
  const a = app(id), g = GROUPS[a.group];
  openModal(`<div class="mh">${logo(id, true)}<div><h2>Connect ${a.name}</h2><span class="small muted">${g[0]}</span></div></div>
    <p>Zaki will be able to:</p><ul>${g[1].map(c => `<li>${c}</li>`).join("")}</ul>
    ${id === "slack" ? `<label class="small" for="chan"><b>Post wins and alerts to</b></label><select id="chan"><option>#team-wins</option><option>#leads</option><option>#general</option><option>Just me</option></select>` : ""}
    ${id === "phone" ? `<p class="small muted">You get a number that rings your cell. Calls start with a short "this call may be recorded" message.</p>` : ""}
    <p class="small faint">Demo only. Nothing really connects.</p>
    <div class="btns"><button class="ghost" data-close>Cancel</button><button class="btn" data-doconnect="${id}">Allow and connect</button></div>`);
}

function composeModal(title, sub, via, text, verb, done, note) {
  modalSend = done;
  openModal(`<div class="mh">${via ? logo(via, true) : `<span class="ic acc">${svg("spark")}</span>`}<div><h2>${esc(title)}</h2><span class="small muted">${esc(sub)}</span></div></div>
    <label class="small muted" for="pv">Written for you. Change anything before it goes out.</label><textarea id="pv">${esc(text)}</textarea>
    ${note ? `<p class="small muted" style="display:flex;gap:6px;align-items:center">${svg("check", 14)}${esc(note)}</p>` : ""}
    <div class="btns"><button class="ghost" data-close>Cancel</button><button class="btn" data-modalsend>${verb}</button></div>`);
}

function callModal(id) {
  const c = calls[id] || uploaded.find(u => u.id === id);

    <p>${esc(c.summary)}</p>
    <div class="sec"><h3>Added to their profile</h3><div class="actions">${c.learned.map(l => `<span class="pill neu">${esc(l)}</span>`).join("")}</div></div>
    <div class="sec"><h3>To do</h3><ul>${c.todo.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>Send this call somewhere</h3><div class="actions">${callActions.map(a => needBtn(a.needs, a.id === "crm" && anyOn(CRMS) ? "Save to " + app(anyOn(CRMS)).name : a.label, `data-callact="${a.id}" data-cid="${id}"`)).join("")}</div></div>
    <div class="scores">
      <div class="score"><span>Let them talk <b>${s.talk}</b></span><span class="bar"><i style="width:${s.talk}%"></i></span></div>
      <div class="score"><span>Good questions <b>${s.q}</b></span><span class="bar"><i style="width:${s.q}%"></i></span></div>
      <div class="score"><span>Next step booked <b>${s.next ? "Yes" : "No"}</b></span><span class="bar"><i style="width:${s.next ? 100 : 15}%"></i></span></div>
    </div>
    <div class="sec"><h3>Transcript</h3><div class="transcript">${c.lines.map(([w, t]) => `<div><b>${w}:</b> ${esc(t)}</div>`).join("")}</div></div>
    <div class="btns"><button class="ghost" data-close>Close</button></div>`, true);

/* ================= search / ask ================= */
let hl = 0;
function searchResults(q) {
  const n = q.toLowerCase();
  const people = role === "agent" ? contacts.filter(c => (c.name + " " + c.wants.map(w => w[1]).join(" ")).toLowerCase().includes(n)).map(c => ({ kind: "contact", id: c.id, title: c.name, sub: STAGES[c.stage], icon: "user" })) : team.filter(t => t.name.toLowerCase().includes(n)).map(t => ({ kind: "agent", id: t.id, title: t.name, sub: t.label, icon: "user" }));
  const ds = (role === "lead" ? deals : deals.filter(d => d.agent === "Maria Lopez")).filter(d => (d.addr + " " + dealName(d)).toLowerCase().includes(n)).map(d => ({ kind: "deal", id: d.id, title: d.addr, sub: dealName(d), icon: "doc" }));
  return [...people.slice(0, 4), ...ds.slice(0, 3), { kind: "ask", title: `Ask: "${q}"`, sub: "Assistant", icon: "spark" }];
}
function showResults() {
  const q = $("#q").value.trim(), box = $("#results");
  if (!q) { box.hidden = true; return; }
  const rs = searchResults(q); hl = Math.min(hl, rs.length - 1);
  box.hidden = false;
  box.innerHTML = rs.map((r, k) => `<button class="res ${k === hl ? "hl" : ""}" data-res="${k}"><span class="ic acc" style="width:28px;height:28px">${svg(r.icon, 14)}</span><span><b style="font-weight:600">${esc(r.title)}</b><br><span class="small muted">${esc(r.sub)}</span></span><span class="k">${r.kind === "ask" ? "Enter" : ""}</span></button>`).join("");
  box._rs = rs;
}
function pickResult(r) {
  $("#q").value = ""; $("#results").hidden = true;
  if (r.kind === "contact") { drawer = { type: "contact", id: r.id }; renderDrawer(); }
  else if (r.kind === "agent") { drawer = { type: "agent", id: r.id }; renderDrawer(); }
  else if (r.kind === "deal") { tab = "deals"; flashDeal = r.id; openDeals.add(r.id); drawer = null; render(); }
  else { tab = "chat"; ask(r.title.slice(6, -1)); }
}

/* ================= events ================= */
document.addEventListener("input", e => { if (e.target.id === "q") { hl = 0; showResults(); } });
document.addEventListener("keydown", e => {
  if (e.target.id === "q") {
    const box = $("#results"), rs = box._rs || [];
    if (e.key === "ArrowDown") { e.preventDefault(); hl = Math.min(rs.length - 1, hl + 1); showResults(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); hl = Math.max(0, hl - 1); showResults(); }
    else if (e.key === "Enter" && rs.length && !box.hidden) { e.preventDefault(); pickResult(rs[e.metaKey || e.ctrlKey ? rs.length - 1 : hl]); }
    else if (e.key === "Escape") { e.target.value = ""; box.hidden = true; e.target.blur(); }
    return;
  }
  if (e.key === "/" && role && !e.target.matches("input, textarea, select")) { e.preventDefault(); $("#q")?.focus(); return; }
  if (e.key === "Escape") { if ($("#modalRoot").innerHTML) closeModal(); else if (drawer) { drawer = null; renderDrawer(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".item.click, tr.click")) { e.preventDefault(); e.target.click(); }
});

document.addEventListener("click", e => {
  if (!e.target.closest("#search")) { const r = $("#results"); if (r) r.hidden = true; }
  const close = e.target.closest("[data-close]");
  if (close && (!close.classList.contains("overlay") || e.target === close)) { closeModal(); return; }
  const t = e.target.closest("button, [data-contact], [data-call], [data-agent], [data-closedrawer]");
  if (!t) return;
  const d = t.dataset;

  if (d.res !== undefined) { pickResult($("#results")._rs[+d.res]); return; }
  if (t.id === "switchRole") { role = null; drawer = null; render(); return; }
  if (d.role) { role = d.role; tab = tabsFor[role][0][0]; filter = "all"; render(); return; }
  if (d.tab) { tab = d.tab; drawer = null; render(); window.scrollTo({ top: 0 }); return; }
  if (d.closedrawer !== undefined) { drawer = null; renderDrawer(); return; }
  if (d.filter) { filter = d.filter; render(); return; }
  if (d.contact) { drawer = { type: "contact", id: d.contact }; renderDrawer(); return; }
  if (d.agent) { drawer = { type: "agent", id: d.agent }; renderDrawer(); return; }
  if (d.call) { callModal(d.call); return; }
  if (d.gotodeal) { tab = "deals"; flashDeal = d.gotodeal; openDeals.add(d.gotodeal); drawer = null; render(); return; }
  if (d.toggledeal) { openDeals.has(d.toggledeal) ? openDeals.delete(d.toggledeal) : openDeals.add(d.toggledeal); render(); return; }
  if (d.done) { doneItems.add(d.done); toast("Marked done"); render(); return; }
  if (d.stage) { const c = contact(drawer.id); c.stage = +d.stage; toast(`Moved to ${STAGES[c.stage]}${anyOn(CRMS) ? " and updated in " + app(anyOn(CRMS)).name : ""}`); render(); return; }
  if (d.shownum) { drawer.shownum = !drawer.shownum; renderDrawer(); return; }
  if (d.copy) { navigator.clipboard?.writeText(d.copy).then(() => toast("Copied"), () => toast("Select the number to copy it")); return; }
  if (d.ask !== undefined) { drawer = null; tab = "chat"; ask(d.ask); return; }
  if (d.toast) { toast(d.toast); return; }
  if (d.connect) { connectModal(d.connect); return; }
  if (d.disconnect) { app(d.disconnect).on = false; toast(app(d.disconnect).name + " removed"); render(); return; }
  if (d.doconnect) {
    const a = app(d.doconnect); a.on = true;
    if (a.id === "slack") { const v = $("#chan").value; slackChannel = v === "Just me" ? "your messages" : v; }
    closeModal(); toast(a.name + " connected"); render(); return;
  }
  if (d.modalsend !== undefined) { const msg = modalSend; closeModal(); toast(msg || "Sent"); return; }
  if (d.compose) {
    const c = contact(drawer.id);
    if (d.compose === "text") {
      if (!app("sms").on) { connectModal("sms"); return; }
      composeModal("Text to " + c.name, "Based on your last conversation", "sms", `Hi ${first(c.name)}! Quick update: ${c.next.charAt(0).toLowerCase() + c.next.slice(1)}. Talk soon!`, "Send", "Text sent");
    } else {
      const via = anyOn(["gmail", "outlook"]); if (!via) { connectModal("gmail"); return; }
      composeModal("Email to " + c.name, "Based on what they want", via, `Hi ${first(c.name)},\n\nFollowing up on what you told me:\n${c.wants.slice(0, 3).map(w => "- " + w[1]).join("\n")}\n\n${c.next}.\n\nBest,\nMaria`, "Save draft", "Draft saved in " + app(via).name);
    }
    return;
  }
  if (d.callact) {
    const a = callActions.find(x => x.id === d.callact), c = calls[d.cid] || uploaded.find(u => u.id === d.cid);
    composeModal(a.title(c), "From your call with " + c.who, anyOn(a.needs), a.body(c), a.verb, a.done()); return;
  }
  if (d.sign) {
    const via = anyOn(SIGN), deal = deals.find(x => x.id === d.sign);
    composeModal(`Send ${d.doc} for signature`, `${deal.addr}, through ${app(via).name}`, via,
      `To: ${dealName(deal)}\n\nHi ${first(dealName(deal))}, here's the ${d.doc.toLowerCase()} for ${deal.addr}. It takes about a minute to sign. We need it back before ${wk(nextMs(deal)[1])} ${fmt(nextMs(deal)[1])}.`, "Send", `Sent through ${app(via).name}. You'll get a note when it's signed.`); return;
  }
  if (d.nudge) {
    const via = anyOn(["slack", "msteams"]), deal = d.about && deals.find(x => x.id === d.about);
    composeModal("Message " + d.nudge, "Direct message in " + app(via).name, via,
      deal ? `Hey ${first(d.nudge)}, heads up on ${deal.addr}: ${nextMs(deal)[0].toLowerCase()} ${rel(nextMs(deal)[1])}.${deal.risk ? " " + deal.risk + "." : ""} Need a hand?` : `Hey ${first(d.nudge)}, checking in. You have a few leads waiting. Want to grab 15 minutes today to go through them?`, "Send", "Message sent in " + app(via).name); return;
  }
  if (d.reassign) {
    doneItems.add(d.reassign);
    toast(`3 leads moved to Maria. She got a ${anyOn(["slack", "msteams"]) ? app(anyOn(["slack", "msteams"])).name + " message" : "text"} and has 15 minutes to call.`); render(); return;
  }
  if (d.rule) {
    const r = rules.find(x => x.id === d.rule);
    if (r.needs && !anyOn(r.needs)) { r.on = true; connectModal(r.needs[0]); return; }
    r.on = !r.on; toast(r.on ? "Rule turned on" : "Rule turned off"); render(); return;
  }
  if (d.lst) {
    const l = listings.find(x => x.id === d.lid), via = mailVia();
    if (d.lst === "report") composeModal("Monday report for " + street(l), "To " + l.seller, via, sellerReport(l), via ? "Save draft" : "Copy", via ? "Draft saved in " + app(via).name : "Copied", "Honest about weak feedback. Check the numbers before it goes out.");
    if (d.lst === "comp") composeModal("Friday update for " + street(l), "To " + l.seller, via, compUpdate(l), via ? "Save draft" : "Copy", via ? "Draft saved in " + app(via).name : "Copied");
    if (d.lst === "copy") composeModal("Listing copy for " + street(l), "MLS remarks and 3 social posts", null, listingCopy(l), "Copy", "Copied", "Fair housing check passed: it describes the home, not who should live there.");
    if (d.lst === "setup") composeModal("Friday search for " + street(l), "Search to save in your MLS, plus a note to the sellers", via, searchSetup(l), via ? "Save draft" : "Copy", "Search saved. The sellers' note is in your drafts.");
    return;
  }
  if (d.draft) {
    if (d.draft === "db") { tab = "chat"; ask("Who might sell soon?"); return; }
    const [title, sub, text] = drafts[d.draft](), r = routines.find(x => x.id === d.draft);
    composeModal(title, sub, d.draft === "plan" ? anyOn(["gcal", "outlook"]) : mailVia(), text, "Looks good", r.who === "Jen" ? "Sent to Jen to look over" : "Saved. Nothing went out yet.",
      d.draft === "social" ? "Fair housing check passed on every post." : ""); return;
  }
  if (d.milestones) { const [title, sub, text] = milestoneDraft(deals.find(x => x.id === d.milestones)); composeModal(title, sub, mailVia(), text, "Send to Jen", "Sent to Jen to look over"); return; }
  if (d.routine) {
    const r = routines.find(x => x.id === d.routine);
    if (r.needs && !anyOn(r.needs)) { r.on = true; connectModal(r.needs[0]); return; }
    r.on = !r.on; toast(r.on ? "Turned on" : "Turned off"); render(); return;
  }
  if (d.auto) {
    const a = autos.find(x => x.id === d.auto);
    if (a.needs && !anyOn(a.needs)) { a.on = true; connectModal(a.needs[0]); return; }
    a.on = !a.on; toast(a.on ? "Turned on" : "Turned off"); render(); return;
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "sendForm") { const v = $("#chatInput").value.trim(); if (v) ask(v); }
  if (e.target.dataset.addwant) {
    const v = $("#wantIn").value.trim(); if (!v) return;
    (addedWants[e.target.dataset.addwant] ||= []).unshift(["Note", v, "Added by you, today"]);
    renderDrawer(); toast("Added to their profile");
  }
});

function ask(q) {
  const log = chatLog[role];
  log.push({ from: "me", text: q });
  const hit = bot[role].find(([re]) => re.test(q));
  render();
  setTimeout(() => { log.push({ from: "bot", text: hit ? hit[1] : fallback }); if (tab === "chat") render(); }, 450);
}

document.addEventListener("change", e => {
  if (e.target.id !== "upload" || !e.target.files[0]) return;
  const f = e.target.files[0], w = $("#working");
  const steps = ["Transcribing", "Finding who said what", "Pulling out what they want", "Filing it in your apps"];
  let i = 0;
  const tick = () => {
    if (i < steps.length) { w.innerHTML = `<div class="working"><span class="spin"></span>${steps[i++]} <span class="small faint">${esc(f.name)}</span></div>`; setTimeout(tick, 800); return; }
    const id = "u" + uploaded.length;
    uploaded.unshift({ id, who: "New lead from upload", agent: "Maria Lopez", via: "Upload", len: "12 min", when: "Just now", score: 81,
      summary: "Demo only. In the real app this is the actual write-up of " + f.name + ".", todo: ["Send listings discussed on the call", "Follow up Thursday"],
      learned: ["Wants a yard", "Under $450k"], textMsg: "Thanks for the call today! I'll send those listings this afternoon.",
      lines: [["Agent", "Thanks for hopping on. What are you looking for?"], ["Lead", "Something with a yard, under 450."]] });
    render(); callModal(id);
  };
  tick();
});

render();
</script>

</body>
</html>
